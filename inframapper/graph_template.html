<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Type system: three roles.
     Inter        = prose and controls
     IBM Plex Mono = indicators (domains, hashes, IPs, queries): the things an analyst copies
     Martian Mono  = the instrument layer: labels, tabs, badges, counts, dates -->
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"] {
    --bg:#0e0f0d; --panel:#151613; --panel-2:#1b1c18; --line:#2a2b26; --line-2:#3b3c35;
    --fg:#e8e4d8; --fg-2:#bdb8aa; --muted:#8a8679; --accent:#e5a23c; --lead:#5bb8cc; --accent-dim:#e5a23c33; --on-accent:#16120a;
    --bad:#d4553f; --bad-text:#ef7a66; --warn:#d88a33; --ok:#7f9f6a; --info:#7b9fb8; --rep:#cf7a9c;
    --grid:#ffffff0f; --shadow:0 12px 32px #000000a0, 0 1px 0 #ffffff08 inset; color-scheme:dark;
  }
  :root[data-theme="light"] {
    --bg:#f3f2ee; --panel:#ffffff; --panel-2:#f8f7f3; --line:#e5e3dc; --line-2:#cfccc2;
    --fg:#1d1c18; --fg-2:#45433c; --muted:#77746a; --accent:#b0691a; --lead:#1f7a8c; --accent-dim:#b0691a2b; --on-accent:#ffffff;
    --bad:#c2412d; --bad-text:#b3371f; --warn:#b8641a; --ok:#4b7a3a; --info:#35698f; --rep:#a8466f;
    --grid:#00000014; --shadow:0 1px 2px #0000000d, 0 10px 28px #0000001c; color-scheme:light;
  }
  :root {
    --sans:"Inter", system-ui, "Segoe UI", sans-serif;
    --label:"Martian Mono", "IBM Plex Mono", ui-monospace, monospace;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  ::selection { background:var(--accent); color:var(--on-accent); }
  /* Inter cv05 / cv08: tailed l and serifed I, so l / I / 1 never blur together in an indicator */
  body { margin:0; background:var(--bg); color:var(--fg); font:13.5px/1.6 var(--sans); height:100vh; overflow:hidden;
         -webkit-font-smoothing:antialiased; font-feature-settings:"cv05","cv08","cv11","ss03"; transition:background .2s; }
  #graph { position:fixed; inset:0; background:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/22px 22px, var(--bg); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:2px; box-shadow:var(--shadow); }
  /* viewfinder corners: the floating panels frame the graph like a lens */
  .card::before, #explore::after, #entity::after { content:""; position:absolute; width:12px; height:12px; pointer-events:none; }
  .card::before { top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
  #explore::after, #entity::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--line-2); border-right:2px solid var(--line-2); }
  #explore { position:fixed; top:16px; left:16px; width:410px; max-height:calc(100vh - 32px); display:flex; flex-direction:column; z-index:3; }
  #explore .panes { overflow:auto; flex:1; min-height:0; }
  #explore.collapsed .tabs, #explore.collapsed .panes { display:none; }
  #explore.collapsed header { border-bottom:0; }
  header { padding:18px 20px 16px; border-bottom:1px solid var(--line); position:relative; }
  .icon-btn { background:none; border:1px solid transparent; color:var(--muted); width:28px; height:28px; border-radius:2px; cursor:pointer;
              display:inline-grid; place-items:center; padding:0; }
  .icon-btn:hover { color:var(--fg); background:var(--panel-2); border-color:var(--line); }
  .icon-btn.on { color:var(--accent); }
  .icon-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  header .icon-btn { position:absolute; top:12px; right:12px; }
  #entity { position:fixed; top:16px; right:16px; width:450px; max-height:calc(100vh - 96px); display:flex; flex-direction:column; z-index:3; }
  #entity[hidden] { display:none; }
  .ent-head { display:flex; align-items:center; gap:14px; padding:16px 14px 16px 20px; border-bottom:1px solid var(--line); }
  .ent-head img { width:40px; height:40px; flex:none; }
  .ent-head .t { flex:1; min-width:0; }
  .ent-head .ty { font:500 9.5px/1 var(--label); letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:7px; }
  .ent-head .nm { font:500 15px/1.35 var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #entity #p-node { overflow:auto; padding:0 0 12px; }
  .ent-top { padding:14px 20px 8px; }
  details.sec { border-top:1px solid var(--line); }
  details.sec > summary { list-style:none; cursor:pointer; padding:14px 20px; display:flex; align-items:center; gap:10px;
                          font:400 10px/1 var(--label); letter-spacing:.08em; text-transform:uppercase; color:var(--fg-2); user-select:none; }
  details.sec > summary::-webkit-details-marker { display:none; }
  details.sec > summary::before { content:""; width:6px; height:6px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted);
                                  transform:rotate(-45deg); transition:transform .15s; margin-right:2px; }
  details.sec[open] > summary::before { transform:rotate(45deg); border-color:var(--accent); }
  details.sec > summary:hover { background:var(--panel-2); color:var(--fg); }
  details.sec > .body { padding:0 20px 16px; }
  #controls { position:fixed; right:16px; bottom:16px; display:flex; align-items:center; gap:2px; padding:4px; z-index:3; }
  #controls .sep { width:1px; height:18px; background:var(--line); margin:0 4px; }
  #controls .icon-btn { width:36px; height:36px; }
  #controls .icon-btn svg { width:17px; height:17px; }
  /* wordmark: reticle + "Infra" in the instrument face, "Mapper" in light Inter, the view name trailing */
  header .eyebrow { display:flex; align-items:center; gap:9px; margin-bottom:12px; color:var(--fg-2); font:300 13px/1 var(--sans); letter-spacing:-.005em; }
  header .eyebrow::before { content:""; width:11px; height:11px; flex:none; border-radius:50%; border:1.5px solid var(--accent);
                            background:radial-gradient(circle, var(--accent) 0 1.6px, transparent 2.2px); }
  header .eyebrow b { font:500 11px/1 var(--label); letter-spacing:.04em; color:var(--fg); margin-right:-4px; }
  header .eyebrow .view { font:400 9.5px/1 var(--label); letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
                          padding-left:9px; border-left:1px solid var(--line-2); }
  header h1 { margin:0 0 8px; font:500 16px/1.4 var(--mono); word-break:break-all; letter-spacing:-.01em; }
  header .meta { color:var(--muted); font:300 10.5px/1.6 var(--label); letter-spacing:-.01em; }
  .tabs { display:flex; border-bottom:1px solid var(--line); padding:0 10px; background:var(--panel-2); }
  .tabs button { flex:auto; background:none; border:0; color:var(--muted); padding:14px 6px 13px; cursor:pointer; white-space:nowrap;
                 font:400 9.5px/1 var(--label); letter-spacing:.06em; text-transform:uppercase; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button:hover { color:var(--fg-2); }
  .tabs button.on { color:var(--fg); font-weight:500; border-bottom-color:var(--accent); }
  .pane { display:none; padding:18px 20px 22px; }
  .pane.on { display:block; }
  .panes::-webkit-scrollbar, #p-node::-webkit-scrollbar { width:8px; }
  .panes::-webkit-scrollbar-thumb, #p-node::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:4px; }
  input[type=search], select { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--line-2); color:var(--fg);
                               border-radius:2px; margin-bottom:14px; font:13px var(--mono); outline:none; padding:10px 12px; }
  input[type=search]::placeholder { font-family:var(--sans); color:var(--muted); }
  input[type=search]:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  select { padding:6px 8px; margin-bottom:6px; }
  input[type=checkbox] { accent-color:var(--accent); }
  .types label { display:flex; align-items:center; gap:10px; padding:7px 0; cursor:pointer; border-bottom:1px dotted var(--line); }
  .dot { width:10px; height:10px; border-radius:1px; display:inline-block; flex:none; }
  .types .n { margin-left:auto; color:var(--muted); font:300 11px var(--label); font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:9px 8px 9px 0; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  td { font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font:400 9px var(--label); letter-spacing:.08em; text-transform:uppercase; }
  /* property keys are identifiers (vt_malicious, first_seen): kept in their own case, in the indicator face */
  .k { color:var(--muted); width:36%; word-break:normal; font:400 11.5px/1.5 var(--mono); padding-top:10px; }
  code, pre, .copy { font-family:var(--mono); }
  code { background:var(--panel-2); border:1px solid var(--line); padding:1px 6px; border-radius:2px; font-size:12.5px; }
  code.copy { display:block; padding:11px 14px; font-size:14px; line-height:1.5; color:var(--fg); border-left:2px solid var(--accent); word-break:break-all; }
  code.copy:hover { background:var(--bg); }
  .broad { color:var(--muted); text-decoration:line-through; }
  tr.refine td:first-child { border-left:2px solid var(--accent); padding-left:10px; }
  tr.refine code { font-size:11.5px; }
  #p-pivots th, #p-pivots td:last-child { white-space:nowrap; word-break:normal; text-align:right; font-family:var(--label); }
  #p-pivots td:last-child { font-weight:300; font-size:11.5px; }
  #p-pivots th:nth-child(-n+2) { text-align:left; }
  #p-pivots .hint, #p-hunt .hint { word-break:normal; margin-top:4px; }
  #p-pivots code { display:block; white-space:pre-wrap; word-break:break-all; }
  .badge { display:inline-block; padding:4px 7px 3px; border-radius:2px; font:400 9.5px/1.4 var(--label); letter-spacing:.04em; text-transform:uppercase;
           border:1px solid var(--line-2); color:var(--fg-2); background:transparent; vertical-align:1px; }
  .badge.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  .badge.ok { border-color:var(--ok); color:var(--ok); }
  ul.ev { margin:6px 0 4px; padding-left:18px; font-size:13px; line-height:1.55; color:var(--fg-2); }
  ul.ev li { margin:5px 0; } ul.ev li::marker { color:var(--muted); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; text-underline-offset:2px; }
  .copy { cursor:pointer; }
  .hint { color:var(--muted); font-size:12.5px; line-height:1.6; }
  p { margin:10px 0; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
  .links { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; font-weight:500; }
  .rel { display:flex; flex-direction:column; gap:4px; margin:4px 0 12px; }
  .rel .arrow { color:var(--muted); font-size:12px; padding-left:10px; }
  .rel .arrow b { color:var(--accent); font-weight:600; }
  h4 { margin:22px 0 10px; font:400 10px/1 var(--label); text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
       display:flex; align-items:center; gap:10px; }
  h4::after { content:""; flex:1; height:1px; background:var(--line); }
  pre.query { margin:0 0 10px; padding:12px 14px; line-height:1.55; background:var(--bg); border:1px solid var(--line); border-left:2px solid var(--info);
              border-radius:2px; white-space:pre-wrap; word-break:break-all; font-size:12.5px; }
  .tl-lane { margin:14px 0 22px; }
  .tl-name { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .tl-name b { color:var(--fg); font:500 9.5px var(--label); letter-spacing:.06em; text-transform:uppercase; }
  .tl-track { position:relative; height:16px; background:var(--bg); border:1px solid var(--line); border-radius:1px; }
  .tl-seg { position:absolute; top:3px; height:8px; border-radius:1px; opacity:.6; }
  .tl-dot { position:absolute; top:2px; width:10px; height:10px; margin-left:-5px; border-radius:1px; border:1px solid var(--bg); cursor:pointer; transform:rotate(45deg); }
  .tl-chg { position:absolute; top:-3px; bottom:-3px; width:0; border-left:1px dashed var(--muted); }
  .tl-vals { margin:8px 0 0; padding:0; list-style:none; font-size:12.5px; }
  .tl-vals li { display:flex; gap:10px; align-items:baseline; padding:3px 0; }
  .tl-vals .v { flex:1; word-break:break-all; font-family:var(--mono); }
  .tl-vals .d, .tl-axis { color:var(--muted); white-space:nowrap; font:300 10px var(--label); }
  .tl-axis { display:flex; justify-content:space-between; margin-top:3px; }
  .chg td { font-size:11.5px; }
  .chg .old { color:var(--muted); text-decoration:line-through; }
  .btn { background:transparent; color:var(--fg); border:1px solid var(--line-2); border-radius:2px; padding:9px 14px 8px; cursor:pointer; text-decoration:none;
         font:400 9.5px/1.2 var(--label); letter-spacing:.06em; text-transform:uppercase; }
  .btn:hover { border-color:var(--fg-2); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.45; cursor:default; }
  .pivot-box { border:1px solid var(--line); background:var(--panel-2); border-radius:2px; padding:14px 16px; margin:4px 0 6px; }
  .pivot-box .srcs { display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:12px; }
  .verdict-box .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .verdict-box .btn.sel { border-color:var(--accent); color:var(--accent); }
  .verdict-box input, .verdict-box textarea { width:100%; box-sizing:border-box; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:2px; padding:7px 9px; font:13px var(--mono); margin-bottom:8px; }
  .verdict-box textarea { min-height:52px; resize:vertical; font-family:var(--sans); }
  .regex-box textarea { width:100%; min-height:88px; resize:vertical; background:var(--bg); color:var(--fg); border:1px solid var(--line-2);
                        border-radius:2px; padding:9px 11px; font:12.5px/1.6 var(--mono); outline:none; margin-bottom:10px; }
  .regex-box textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .pf-lab { display:flex; align-items:center; gap:8px; margin-bottom:8px; font:400 9.5px/1 var(--label); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .pf-dot { width:10px; height:10px; border-radius:50%; border:2.5px solid var(--accent); flex:none; }
  .pf-dot.b { border-color:var(--lead); }
  .pf-swap { display:flex; justify-content:flex-end; margin:-10px 0 -6px; }
  .pf-opt { display:flex; gap:7px; align-items:center; cursor:pointer; margin-bottom:6px; font-size:13px; }
  .pf-sum { margin:16px 0 4px; font:300 11px/1.5 var(--label); color:var(--fg-2); }
  .pf-sum b { font-weight:500; color:var(--accent); }
  ol.pf-path { list-style:none; margin:10px 0 12px; padding:10px 12px; background:var(--panel-2); border:1px solid var(--line); border-left:2px solid var(--accent); border-radius:2px; }
  ol.pf-path:hover { border-color:var(--line-2); border-left-color:var(--accent); }
  ol.pf-path li { font-size:12.5px; word-break:break-all; }
  .pf-rel { display:block; margin:4px 0 4px 4px; padding-left:12px; border-left:1px dashed var(--line-2); color:var(--muted);
            font:400 9.5px/1.9 var(--label); letter-spacing:.04em; }
  .opt { display:flex; gap:7px; align-items:center; margin:8px 0 0; cursor:pointer; font-size:13px; }
  details.fold { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; }
  details.fold > summary { cursor:pointer; list-style:none; font:400 9.5px/1 var(--label); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:"+ "; }
  details.fold[open] > summary::before { content:"− "; }
  details.fold .legend { margin:12px 0 0; padding:0; border:0; }
  details.fold #p-pivots { margin-top:10px; }
  .camp-list { display:flex; flex-direction:column; gap:6px; }
  button.camp { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--panel-2); color:var(--fg);
                border:1px solid var(--line); border-left:2px solid var(--rep); border-radius:2px; padding:9px 11px; cursor:pointer; font:inherit; }
  button.camp:hover { border-color:var(--line-2); border-left-color:var(--rep); }
  .camp-name { font-weight:600; }
  .camp-meta { flex:1; color:var(--muted); font:300 10px/1.3 var(--label); }
  #camp-iocs .rep-list { margin-top:10px; }
  .badge.lead { border-color:var(--lead); color:var(--lead); }
  .pf-links { margin-left:auto; color:var(--muted); font-size:12px; font-weight:400; }
  .ladder { margin:10px 0 20px; }
  .ld-head { font:400 9.5px/1.5 var(--label); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .ld-head code { text-transform:none; letter-spacing:0; }
  .ladder ol { list-style:none; margin:0; padding:0 0 0 12px; border-left:1px solid var(--line-2); }
  li.ld { position:relative; padding:6px 0 12px 10px; }
  li.ld::before { content:""; position:absolute; left:-17px; top:10px; width:9px; height:9px; border-radius:50%; background:var(--panel); border:1.5px solid var(--muted); }
  li.ld.best::before { background:var(--accent); border-color:var(--accent); }
  li.ld.dropped { opacity:.5; }
  .ld-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .ld-label { font:500 9.5px/1.4 var(--label); letter-spacing:.06em; text-transform:uppercase; color:var(--fg-2); }
  li.ld.best .ld-label { color:var(--accent); }
  .ld-n { font:300 12px var(--label); color:var(--fg); white-space:nowrap; }
  .ld-bar { height:3px; background:var(--line); margin:5px 0 7px; }
  .ld-bar i { display:block; height:100%; background:var(--muted); }
  li.ld.best .ld-bar i { background:var(--accent); }
  li.ld code { display:block; font-size:11.5px; word-break:break-all; padding:4px 7px; }
  .ld-cond, .ld-why, .ld-dec { font-size:12px; line-height:1.45; margin-top:5px; color:var(--muted); }
  .ld-why { color:var(--fg-2); }
  .ld-sample { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .ld-sample span { font:11px var(--mono); color:var(--muted); border:1px solid var(--line); padding:1px 5px; border-radius:2px; }
  .ld-foot { font-size:12.5px; margin:2px 0 0 12px; }
  .seen-list { list-style:none; padding:0; margin:0; }
  .seen-list li { padding:6px 0; border-bottom:1px solid var(--line); }
  .seen-list .m { color:var(--muted); font-size:12px; }
  .pivot-box label { display:flex; gap:7px; align-items:center; cursor:pointer; font-size:13px; }
  #jobs { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; display:flex; flex-direction:column; gap:6px; max-width:min(460px, 60vw); z-index:5; }
  .job { background:var(--panel); border:1px solid var(--line-2); border-left:3px solid var(--accent); border-radius:2px; padding:8px 11px; font-size:12.5px; box-shadow:var(--shadow); }
  .job.error { border-left-color:var(--bad); }
  .job .l { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:11px var(--mono); margin-top:3px; }
  .job .x { float:right; cursor:pointer; color:var(--muted); margin-left:8px; }
  .tree, .tree ul { list-style:none; margin:0; padding-left:14px; }
  .tree { padding-left:0; }
  .tree ul { border-left:1px solid var(--line); margin-left:5px; padding-left:12px; }
  .tree li { margin:3px 0; line-height:2; }
  .tree details > summary { cursor:pointer; list-style:none; }
  .tree details > summary::-webkit-details-marker { display:none; }
  .tree details > summary::before { content:"+"; display:inline-block; width:14px; color:var(--muted); font-family:var(--label); font-size:11px; }
  .tree details[open] > summary::before { content:"−"; color:var(--accent); }
  .tree .leaf::before { content:""; display:inline-block; width:14px; }
  .tree .via { color:var(--muted); font:300 9.5px var(--label); }
  .tree .row > * { margin-right:4px; }
  .tree a[data-id], .rep-list a[data-id] { color:var(--fg); font:12.5px var(--mono); }

<script>
const D = __DATA__;

document.documentElement.dataset.theme = MODE;
const T = () => THEMES[MODE];

// node colour + glyph (BloodHound-style: filled disc, white icon, label below)
const STYLE = {

};
const GLYPH = {
  Domain:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5M12 3.5C9.4 5.9 8.2 8.7 8.2 12s1.2 6.1 3.8 8.5"/>',

  Title:'<path d="M5 6h14M12 6v13M9 19h6"/>',
  HtmlHash:'<path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13 6l-2 12"/>',
  Script:'<path d="M9 4H8a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h1M15 4h1a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-1"/>',

  NameServer:'<rect x="4.5" y="4.5" width="15" height="15" rx="1.5"/><path d="M8 9h8M8 12h8M8 15h5"/>',
  MailServer:'<rect x="3.5" y="5.5" width="17" height="13" rx="1"/><path d="m3.5 7.5 8.5 6 8.5-6"/>',
  SoaEmail:'<circle cx="12" cy="12" r="3.5"/><path d="M15.5 8.5v4.3a2.6 2.6 0 0 0 5.2 0V12a8.7 8.7 0 1 0-3.4 6.9"/>',

};
const iconCache = {};
function icon(type, fill) {
  const k = type + fill;
  return iconCache[k] || (iconCache[k] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="${fill}"/>` +
    `<g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">` +

document.getElementById("title").textContent = D.title;
const HOST_TYPES = new Set(["File","Domain","IP","URL"]);
const PIVOT_NODES = new Set([...HOST_TYPES, "Certificate"]);   // what can be pivoted on
// in view: confirmed cluster, or pinned because an analyst pivoted on it / on its neighbour
const inCluster = n => !n.props || n.props.cluster !== false || !!n.props.pinned;
let byId = {};
const hidden = new Set();
const showAll = document.getElementById("showall");
// new-domain hunt leads: not confirmed (a look-alike name needs corroboration), but strong / medium ones
// are what the hunt is for, so they're shown by default in their own style with what ties them to the case
const showLeads = document.getElementById("showleads");
const isLead = n => !!(n.props && ["strong", "medium"].includes(n.props.new_domain)) && !inCluster(n);
let leadLinks = new Set();   // look-alike / kit-reuse nodes linking a lead to the cluster
const shownLead = n => showLeads.checked && (isLead(n) || leadLinks.has(n.id));
const inView = n => inCluster(n) || shownLead(n);
let PATH = null;   // active pathfinding result: {a, b, paths, nodes, edges}
// evidence-quality filters (fidelity / confidence / source / freshness; see scoring.py)
const SCF = {fid: 0, conf: 0, src: "", stale: false};
const nscore = n => (D.scores || {})[n.id];
const escore = e => (e.props && e.props.score) || null;
const lowFid = n => SCF.fid > 0 && n.id !== D.seed && (nscore(n) ? (nscore(n).fidelity || 0) < SCF.fid : false);
const edgeOut = e => { const s = escore(e); if (!s) return false;
  return (SCF.conf > 0 && s.confidence < SCF.conf) || (SCF.src && !(s.sources || []).includes(SCF.src)) || (SCF.stale && s.stale); };

function updateMeta() {
  byId = Object.fromEntries(D.nodes.map(n => [n.id, n]));
  leadLinks = new Set();
  for (const e of D.edges) for (const [a, b] of [[e.source, e.target], [e.target, e.source]])
    if (byId[a] && isLead(byId[a]) && byId[b] && !HOST_TYPES.has(byId[b].type) && !inCluster(byId[b])) leadLinks.add(b);
  const nLeads = D.nodes.filter(isLead).length;
  document.getElementById("nleads").textContent = `(${nLeads})`;
  const nCand = D.nodes.filter(n => !inView(n)).length;
  document.getElementById("meta").textContent = `${D.nodes.length - nCand} in view` +
    (nCand ? ` · ${nCand} unconfirmed hidden` : "") + ` · ${String(D.generated).slice(0, 10)}`;
  document.getElementById("ncand").textContent = `(${nCand})`;
}
updateMeta();

function visNode(n) {
  const st = STYLE[n.type] || {c:"#77746a"}, p = n.props || {}, t = T();
  const mal = (p.vt_malicious||0) > 0 || p.malicious === true;
  const seed = n.id === D.seed, inc = inCluster(n), lead = isLead(n), fill = p.broad ? t.broad : st.c;
  return { id:n.id, label:nodeLabel(n), ntype:n.type, shape:"circularImage", image:icon(n.type, fill),
    size: seed ? 28 : (HOST_TYPES.has(n.type) ? 18 : 13),
    color:{ background:fill, border: mal ? t.bad : (seed ? t.accent : (lead ? t.lead : fill)),
            highlight:{background:fill, border:t.ring}, hover:{background:fill, border:t.ring} },
    borderWidth: mal || lead ? 3 : (seed ? 4 : 0), borderWidthSelected: 3, hidden: isHidden(n), physics: inc || shownLead(n),

// ---- change timeline: how a host's IP / cert / title / status / ... evolved over time
let TL = D.timelines || {};
const TL_FIELDS = [["ip","IP address"],["domain","Hostname"],["asn","ASN"],["cert","TLS certificate"],["title","Page title"],
  ["status","HTTP status"],["server","Server"],["registrar","Registrar"],["nameservers","Name servers"],["reported","Reported in"]];
const POINT_FIELDS = new Set(["reported"]);   // events, not a state that changes: dots at their date, nothing more
const PAL = ["#e5a23c","#86b4c9","#b996d4","#9dbf93","#c77d86","#6fa9a1","#d8905f","#b3bd6c","#b96b55","#9f8fc8"];
const day = t => String(t).slice(0,10);
function showTimeline(id, pane) {
  if (!TL[id]) { pane.innerHTML = `<p class="hint">No history collected.</p>`; return; }
  const ev = TL[id], t0 = Date.parse(ev[0].t), t1 = Date.parse(ev[ev.length-1].t), span = Math.max(t1 - t0, 1);
  const x = t => ((Date.parse(t) - t0) / span * 100).toFixed(2) + "%";
  let h = `<p class="hint">${ev.length} observations · ${day(ev[0].t)} → ${day(ev[ev.length-1].t)}</p>`;
  const changes = [];
  for (const [f, name] of TL_FIELDS) {
    const obs = ev.filter(e => e[f] !== undefined); if (!obs.length) continue;
    const vals = new Map();
    obs.forEach(e => { const v = String(e[f]), c = vals.get(v) || {first:e.t, last:e.t, n:0}; c.last = e.t; c.n++; vals.set(v, c); });
    const col = v => PAL[[...vals.keys()].indexOf(v) % PAL.length];
    if (POINT_FIELDS.has(f)) {
      const dots = obs.map(e => `<span class="tl-dot" style="left:${x(e.t)};background:${T().lead}" title="${esc(day(e.t))} · ${esc(e.src)}\n${esc(e[f])}"></span>`).join("");
      h += `<div class="tl-lane"><div class="tl-name"><b>${esc(name)}</b><span>${vals.size} report${vals.size > 1 ? "s" : ""}</span></div>
        <div class="tl-track">${dots}</div>
        <ul class="tl-vals">${[...obs].sort((a, b) => a.t < b.t ? -1 : 1).map(e => `<li><span class="dot" style="background:${T().lead}"></span><span class="v">${esc(e[f])}</span><span class="d">${day(e.t)} · ${esc(e.src)}</span></li>`).join("")}</ul></div>`;
      continue;
    }
    let track = "", prev = null, segStart = null;
    obs.forEach((e, i) => {
      const v = String(e[f]);
      if (prev !== null && v !== prev.v) {
        track += `<span class="tl-chg" style="left:${x(e.t)}"></span>`;
        changes.push({t:e.t, f:name, from:prev.v, to:v, e});
      }
      if (prev === null || v !== prev.v) segStart = e.t;
      const nxt = obs[i+1];
      if (!nxt || String(nxt[f]) !== v) track += `<span class="tl-seg" style="left:${x(segStart)};width:calc(${x(e.t)} - ${x(segStart)});background:${col(v)}"></span>`;
      track += `<span class="tl-dot" style="left:${x(e.t)};background:${col(v)}" title="${esc(e.t.replace("T"," ").slice(0,16))} · ${esc(e.src)}\n${esc(name)}: ${esc(v)}"${e.scan ? ` data-scan="${esc(e.scan)}"` : ""}></span>`;
      prev = {v};
    });
    h += `<div class="tl-lane"><div class="tl-name"><b>${esc(name)}</b><span>${vals.size} value${vals.size>1?"s":""}${vals.size>1?" · changed":""}</span></div>
      <div class="tl-track">${track}</div>
      <ul class="tl-vals">${[...vals].map(([v,c]) => `<li><span class="dot" style="background:${col(v)}"></span><span class="v">${esc(v)}</span><span class="d">${day(c.first)} → ${day(c.last)} · ${c.n}</span></li>`).join("")}</ul></div>`;
  }
  h += `<div class="tl-axis"><span>${day(ev[0].t)}</span><span>${day(ev[ev.length-1].t)}</span></div>`;
  changes.sort((a,b) => a.t < b.t ? -1 : 1);
  h += `<h4>Change log (${changes.length})</h4>` + (changes.length ? `<table class="chg">` + changes.map(c =>
    `<tr><td class="k">${day(c.t)}<br>${esc(c.f)}</td><td><span class="old">${esc(c.from)}</span><br>→ ${esc(c.to)}
     <br><span class="hint">${esc(c.e.src)}${c.e.scan ? ` · <a href="https://urlscan.io/result/${esc(c.e.scan)}/" target="_blank" rel="noopener">scan ↗</a>` : ""}</span></td></tr>`).join("") + `</table>`
    : `<p class="hint">No changes observed in this window.</p>`);
  pane.innerHTML = h;
  pane.querySelectorAll(".tl-dot[data-scan]").forEach(d => d.onclick = () => window.open(`https://urlscan.io/result/${d.dataset.scan}/`, "_blank"));
}

// ---- pivot tree: spanning tree over hosts from the seed, following the analyst's pivots first
function treeParents() {
  const adj = {};
  D.edges.forEach(e => {
    // hosts only, plus the seed itself when it's an input report (report triage: report -> its IOCs)
    const ok = id => id === D.seed || HOST_TYPES.has((byId[id]||{}).type);
    if (!ok(e.source) || !ok(e.target)) return;
    (adj[e.source] = adj[e.source] || []).push([e.target, e.rel, true]);
    (adj[e.target] = adj[e.target] || []).push([e.source, e.rel, false]);

  for (let i = 0; i < order.length; i++) {
    for (const [o, rel, out] of adj[order[i]] || []) {
      if (o in parent || isHidden(byId[o])) continue;
      parent[o] = order[i]; via[o] = [rel, out]; order.push(o);
    }
  }
  // a node the analyst reached by pivoting hangs under the node it was pivoted from
  const under = (x, anc) => { for (; x; x = parent[x]) if (x === anc) return true; return false; };
  for (const id of order) {
    const pf = (byId[id].props || {}).pivot_from;
    if (!pf || pf === parent[id] || !(pf in parent) || under(pf, id)) continue;
    const e = (adj[id] || []).find(([o]) => o === pf);
    parent[id] = pf; via[id] = e ? [e[1], !e[2]] : ["pivot", true];
  }
  return {parent, via};
}

  const onPath = new Set(); for (let x = focus; x && x in parent; x = parent[x]) onPath.add(x);
  const rank = id => { const p = byId[id].props || {}; return [p.expanded ? 0 : 1, -(kids[id]||[]).length, -(p.vt_malicious||0)]; };
  const cmp = (a, b) => { const ra = rank(a), rb = rank(b); for (let i = 0; i < 3; i++) if (ra[i] !== rb[i]) return ra[i] - rb[i]; return 0; };

    (mp.length ? `<h4>Pivot history (${mp.length})</h4><table>` + mp.slice().reverse().map(m => `<tr><td class="k">${esc(String(m.at).slice(0,16).replace("T"," "))}</td>
      <td>${m.type === "regex" ? `urlscan regex: ${(m.patterns||[m.value]).map(x => `<code>${esc(x)}</code>`).join(" ")}` : byId[m.id] ? nodeLink(byId[m.id]) : esc(m.value)}<br><span class="hint">${m.direct} related · ${m.pivot_hits} pivot hits · ${esc((m.sources||[]).join(", "))}${m.force ? " · shared hosting included" : ""}</span></td></tr>`).join("") + `</table>` : "");

// BFS layers from the start, then every predecessor chain back from the target (capped)
function shortestPaths(a, b, directed, hostsOnly, cap = 25) {

  const adj = {};
  D.edges.forEach((e, i) => {
    if (!ok(e.source) || !ok(e.target)) return;
    (adj[e.source] = adj[e.source] || []).push([e.target, i]);

  }).join("");
  box.querySelectorAll("[data-copyq]").forEach(a => a.onclick = ev => {
    ev.preventDefault(); navigator.clipboard && navigator.clipboard.writeText(a.dataset.copyq); a.textContent = "copied"; });
}
function renderRegexBox() {
  const box = document.getElementById("regex-box"), on = LIVE && LIVE.sources.urlscan;
  box.innerHTML = `<h4>Regex hunt</h4>` + (on ? `<div class="regex-box">
    <textarea id="regex-in" spellcheck="false" placeholder=".*okta.*&#10;.*-okta-[a-z]+\\.com"></textarea>
    <button class="btn primary" id="regex-run">Run ▸</button> <button class="btn" id="regex-auto" title="broad regex from the cluster's domain names">Auto from the cluster</button>
    <p class="hint">One regex per line, whole domain name. Each starts broad and is refined from its own hits until it's a usable pivot.</p></div>`
    : `<p class="hint">${LIVE ? "urlscan isn't configured on the server." : "Starts broad, refines from the hits. Run the case live (--serve) to start new ones."}</p>`);
  if (!on) return;
  document.getElementById("regex-run").onclick = () => runRegexes();
  document.getElementById("regex-auto").onclick = () => runRegexes(null, true);
}
// own regexes (from the box), or an automatic ladder from a domain / the cluster
async function runRegexes(domain, auto) {
  let body, title;
  if (domain || auto) {
    body = domain ? {domain} : {};
    title = `regex hunt <b>${esc(domain || "from the cluster")}</b>`;
  } else {
    const ta = document.getElementById("regex-in"), patterns = ta.value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!patterns.length) { ta.focus(); return; }
    body = {patterns};
    title = `regex hunt <b>${esc(patterns.length === 1 ? patterns[0] : patterns.length + " regexes")}</b>`;
  }
  const el = jobCard(title);
  openTab("p-hunt");
  try {
    const r = await fetch("api/regex", {method:"POST", headers:{"Content-Type":"application/json", "X-InfraMapper":"1"}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    running.set(j.job, D.seed);
    pollJob(j.job, el, title);
  } catch (err) { jobDone(el, `Regex hunt failed: ${esc(err.message)}`, true); }
}
renderCampaign();
renderLadders();

// ---- is the pivot server behind this page?
(async () => {
  const hint = document.getElementById("livehint");
  if (location.protocol.startsWith("http")) {
    try { const r = await fetch("api/status"); if (r.ok) LIVE = await r.json(); } catch (e) {}
  }
  hint.innerHTML = LIVE ? `<b>Live</b> · right-click a node to pivot on it.`
    : `Read-only copy · <a href="#" id="copyserve" title="${esc(serveCmd())}">copy the --serve command</a> to pivot live.`;
  const cs = document.getElementById("copyserve");
  if (cs) cs.onclick = ev => { ev.preventDefault(); navigator.clipboard && navigator.clipboard.writeText(serveCmd()); cs.textContent = "copied"; };
  renderTree(D.seed);
  renderRegexBox();
  if (LIVE && LIVE.refreshing) watchRefresh();
})();

// the server shows the saved case at once and catches up (prior reporting, feeds, VT comments) in the
// background; merge the result into the open graph when it's done, keeping the layout
async function watchRefresh() {
  const el = jobCard("Updating prior reporting, feeds &amp; VT comments in the background");
  el.querySelector(".hint").textContent = "the graph is usable meanwhile; pivots queue until it's done";
  for (;;) {
    await new Promise(r => setTimeout(r, 3000));
    let s;
    try { s = await (await fetch("api/status")).json(); } catch (e) { continue; }
    if (s.refreshing) continue;
    if (s.refresh_error) return jobDone(el, `Background update failed: ${esc(s.refresh_error)} · showing the saved case`, true);
    try {
      const added = merge(await (await fetch("api/graph")).json(), D.seed);
      return jobDone(el, `Case updated: prior reporting &amp; VT comments refreshed${added ? ` · ${added} new in view` : ""}`);
    } catch (e) { return jobDone(el, "Case updated · reload the page to see it", true); }
  }
}
