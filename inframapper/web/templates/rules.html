{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title"><i class="bi bi-funnel-fill me-2"></i>Hunting rules</h1>
    <div class="page-subtitle">Saved pivoting logic: a query on a platform, rated for fidelity and confidence.</div></div>
  <button class="btn btn-sm btn-primary" id="new"><i class="bi bi-plus-lg me-1"></i>New rule</button>
</div>

<div class="grid-main-side">
  <div>
    <div class="panel" id="editor">
      <div class="panel-head"><h2 class="panel-title"><i class="bi bi-pencil-square"></i><span id="ed-title">New rule</span></h2></div>
      <div class="panel-body">
        <div class="row g-2">
          <div class="col-md-8"><label class="form-label small-muted" for="r-name">Rule name *</label><input class="form-control form-control-sm" id="r-name" maxlength="120" placeholder="e.g. Phishing kit page title"></div>
          <div class="col-md-4"><label class="form-label small-muted" for="r-plat">Platform *</label><select class="form-select form-select-sm" id="r-plat"></select></div>
          <div class="col-12"><label class="form-label small-muted" for="r-query">Query *</label><input class="form-control form-control-sm mono" id="r-query" maxlength="500" placeholder='e.g. page.title:"Sign in" or hash:&lt;favicon hash&gt;'></div>
          <div class="col-6 col-md-3"><label class="form-label small-muted" for="r-fid">Fidelity *</label><select class="form-select form-select-sm" id="r-fid"></select></div>
          <div class="col-6 col-md-3"><label class="form-label small-muted" for="r-conf">Confidence *</label><select class="form-select form-select-sm" id="r-conf"></select></div>
        </div>
        <div class="field-err" id="ed-err" role="alert"></div>
      </div>
      <div class="panel-head" style="border-top:1px solid var(--border);border-bottom:0">
        <div class="ms-auto"><button class="btn btn-sm btn-primary" id="save" data-busy="Saving…"><i class="bi bi-save me-1"></i>Save rule</button></div>
      </div>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="panel-head"><h2 class="panel-title"><i class="bi bi-collection"></i>Saved rules</h2><span class="panel-meta ms-auto" id="n-rules"></span></div>
      <div class="panel-body flush" id="rule-list">{% for i in range(3) %}<div class="p-3"><span class="skel mb-2" style="width:60%"></span><span class="skel" style="width:85%"></span></div>{% endfor %}</div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const {esc} = IO;
  let S, RULES = [], editing = null;
  const $ = id => document.getElementById(id);
  const opts = (list, sel) => list.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`).join('');

  function fill(r) {
    r = r || {};
    editing = r.id || null;
    $('ed-title').textContent = editing ? 'Edit rule' : 'New rule';
    $('r-name').value = r.name || '';
    $('r-plat').innerHTML = opts(Object.entries(S.platforms), r.platform || 'urlscan');
    $('r-query').value = r.query || '';
    const ratings = S.ratings.map(x => [x, x]);
    $('r-fid').innerHTML = opts(ratings, r.fidelity || 'medium');
    $('r-conf').innerHTML = opts(ratings, r.confidence || 'medium');
    $('ed-err').textContent = '';
    renderList();
  }

  function renderList() {
    $('n-rules').textContent = `${RULES.length} rule${RULES.length === 1 ? '' : 's'}`;
    $('rule-list').innerHTML = RULES.map(r => `<div class="p-3" style="border-top:1px solid var(--border);${r.id === editing ? 'background:var(--accent-glow)' : ''}">
      <a href="#" data-open="${r.id}" class="fw-semibold">${esc(r.name)}</a>
      <div class="small-muted">${esc(S.platforms[r.platform] || r.platform || '?')} · fidelity ${esc(r.fidelity || '?')} · confidence ${esc(r.confidence || '?')}</div>
      <code class="small wrap-any d-block mt-1">${esc(r.query || '')}</code>
      <div class="d-flex gap-1 mt-2"><button class="btn btn-xs btn-outline-secondary" data-open="${r.id}">Edit</button>
        <button class="btn btn-xs btn-outline-secondary" data-cq="${esc(r.query || '')}" title="Copy query"><i class="bi bi-clipboard"></i></button>
        ${r.url ? `<a class="btn btn-xs btn-outline-secondary" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" title="Open on the platform"><i class="bi bi-box-arrow-up-right"></i></a>` : ''}
        <button class="btn btn-xs btn-outline-danger ms-auto" data-rmr="${r.id}" aria-label="Delete rule"><i class="bi bi-trash"></i></button></div></div>`).join('')
      || '<div class="empty-state"><i class="bi bi-funnel"></i>No saved rules yet.</div>';
    document.querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); fill(RULES.find(x => x.id === a.dataset.open)); });
    document.querySelectorAll('[data-cq]').forEach(b => b.onclick = () => IO.copy(b.dataset.cq));
    document.querySelectorAll('[data-rmr]').forEach(b => b.onclick = async () => { const r = RULES.find(x => x.id === b.dataset.rmr);
      if (!await IO.confirm('Delete rule', `Delete “${r.name}”? This cannot be undone.`)) return;
      try { await IO.post(`/api/rules/${r.id}/delete`); if (editing === r.id) editing = null; await reload(); if (!editing) fill(null); IO.toast('Rule deleted', 'ok'); } catch (e) { IO.err(e); } });
  }

  async function save() {
    $('ed-err').textContent = '';
    const body = {name: $('r-name').value, platform: $('r-plat').value, query: $('r-query').value,
      fidelity: $('r-fid').value, confidence: $('r-conf').value};
    try {
      const r = editing ? await IO.post(`/api/rules/${editing}`, body) : await IO.post('/api/rules', body);
      await reload(); fill(RULES.find(x => x.id === r.id)); IO.toast('Rule saved', 'ok');
    } catch (e) { $('ed-err').textContent = e.message; }
  }

  async function reload() {
    const r = await IO.get('/api/rules');
    S = r.schema; RULES = r.items;
    renderList();
  }

  $('new').onclick = () => fill(null);
  $('save').onclick = e => IO.busy(e.currentTarget, save);
  reload().then(() => fill(null)).catch(e => { $('rule-list').innerHTML = IO.errorBox(e); });
})();
</script>
{% endblock %}
