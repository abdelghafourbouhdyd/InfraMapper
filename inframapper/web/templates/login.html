<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — InfraMapper</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script>(function(){var t='dark';try{t=localStorage.getItem('inframapper-theme')||t}catch(e){}document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t)})();</script>
</head><body>
<div class="login-wrap"><div class="panel login-card"><div class="panel-body" style="padding:1.6rem">
  <div class="brand-wordmark mb-1"><span class="bw-brand">Infra</span><span class="bw-protect">Mapper</span><span class="bw-dot"></span></div>
  <p class="brand-tagline mb-3">Sign in</p>
  {% if error %}<div class="note-box danger mb-3">{{ error }}</div>{% endif %}
  <form method="post"><label class="form-label small-muted" for="p">Password</label>
    <input class="form-control mb-3" id="p" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn btn-primary w-100">Sign in</button></form>
</div></div></div></body></html>
